<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation rail · ownvitals mock-up</title>
<link rel="stylesheet" href="ov.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div class="ov" data-theme="light" style="width: 100%; background: var(--surface); font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink)">
  <nav class="rail" aria-label="Main">
    <a class="brand" href="Dashboard.html">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" class="logo-bg"></rect><rect x="4" y="10" width="16" height="5" rx="2.5" class="logo-band"></rect><circle cx="15" cy="12.5" r="3" class="logo-dot"></circle></svg>
      ownvitals
    </a>
    <div class="navgroup">
      <span class="eyebrow">Analyse</span>
      <div class="navlist">
        
          <a href="Dashboard.html" class="" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z" class="ic"></path></svg>
            <span>Overview</span>
            <span class="end"></span>
          </a>
        
          <a href="Metric.html" class="" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5a2.5 2.5 0 1 1-5 0a2.5 2.5 0 1 1 5 0z M6 10.5h12 M12 10.5v5 M8.5 21l3.5-5.5 3.5 5.5" class="ic"></path></svg>
            <span>Body</span>
            <span class="end"></span>
          </a>
        
          <a href="ECG.html" class="" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h4l2-5 4 10 3-7 2 2h5" class="ic"></path></svg>
            <span>Heart &amp; ECG</span>
            <span class="end"></span>
          </a>
        
          <a href="Dashboard.html" class="" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v6 M12 9l-5 5 M12 9l5 5 M7 14v6 M17 14v6 M12 9v11" class="ic"></path></svg>
            <span>Nerve health</span>
            <span class="end small muted">3 of 4</span>
          </a>
        
          <a href="Dashboard.html" class="dim" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" class="ic"></path></svg>
            <span>Sleep</span>
            <span class="end small">n/a</span>
          </a>
        
          <a href="Dashboard.html" class="" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z" class="ic"></path></svg>
            <span>Activity</span>
            <span class="end dot attn"></span>
          </a>
        
          <a href="Findings.html" class="" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-8h11L20 13 M4 13v6h16v-6 M4 13h5l1 2h4l1-2h5" class="ic"></path></svg>
            <span>Findings</span>
            <span class="end count attn">2</span>
          </a>
        
      </div>
    </div>
    <div class="navgroup">
      <span class="eyebrow">Your data</span>
      <div class="navlist">
        
          <a href="Connections.html" class="" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l6-6 M10.5 6.5l1.8-1.8a4 4 0 0 1 5.7 5.7l-1.8 1.8 M13.5 17.5l-1.8 1.8a4 4 0 0 1-5.7-5.7l1.8-1.8" class="ic"></path></svg>
            <span>Connections</span>
            <span class="end dot ok"></span>
          </a>
        
      </div>
    </div>
    <div class="navgroup">
      <span class="eyebrow">Account</span>
      <div class="navlist">
        
          <a href="Settings.html" class="" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10 M18 7h2 M4 17h4 M12 17h8 M16 5v4 M10 15v4" class="ic"></path></svg>
            <span>Settings</span>
            <span class="end"></span>
          </a>
        
          <a href="Security.html" class="" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10.5h12v9.5H6z M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5 M12 14v2.5" class="ic"></path></svg>
            <span>Security</span>
            <span class="end"></span>
          </a>
        
        
          <a href="Admin.html" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z M9 12l2 2 4-4" class="ic"></path></svg>
            <span>Admin</span>
          </a>
        
      </div>
    </div>
  </nav>
</div>
<script>
  // ?theme=dark switches every .ov root, the imported rail included.
  var t = new URLSearchParams(location.search).get('theme') || 'light';
  document.querySelectorAll('.ov').forEach(function (e) { e.setAttribute('data-theme', t); });
</script>
</body>
</html>
