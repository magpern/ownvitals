# The end-to-end overlay: `docker compose -f compose.yaml -f compose.e2e.yaml up -d`
# (e2e/scripts/stack-up.sh does the whole preparation; docs/dev/e2e.md). Everything here is a
# fake: no real Google, Withings or mail provider, and every identity and secret is synthetic.
#
# - fake-oidc answers to Google's two back-channel host names inside the compose network (the
#   egress allowlist is code, so web keeps calling the real names), with a certificate from a
#   throwaway CA that e2e/scripts/stack-prepare.sh adds to web's certifi bundle, mounted over
#   the image's copy. The browser's visit to accounts.google.com is intercepted by Playwright.
# - Google sign-in is switched on for web with a made-up client id and the generated secret.
# - fake-oidc only starts with OWNVITALS_ENVIRONMENT=test; web stays `dev`.
# - fake-withings answers as wbsapi.withings.net and account.withings.com (network aliases) with a
#   certificate from the same throwaway CA, which web and the worker both trust through the
#   mounted bundle. It runs the protocol code of backend/tests (mounted read-only, so it cannot
#   drift from the in-process fake) and publishes NO port: its control endpoints (/__e2e/, plain
#   HTTP on 9101) are reachable from inside the compose network only.

services:
  web:
    environment:
      OWNVITALS_OAUTH_GOOGLE_CLIENT_ID: e2e-client.apps.googleusercontent.com
      # localhost, not 127.0.0.1: WebAuthn has no relying party on an IP address, so passkeys
      # (passkeys.spec.ts) need a host name. The browser and every redirect use this origin.
      OWNVITALS_PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-8000}
    secrets:
      - oauth_google_client_secret
    volumes:
      - ./e2e/.certs/cacert.pem:/app/.venv/lib/python3.12/site-packages/certifi/cacert.pem:ro
    depends_on:
      fake-oidc:
        condition: service_healthy

  # One-off only (`docker compose run migrate python -m ownvitals withings-apps create ...`,
  # e2e/helpers/fake-withings.ts registerApp): the operator command seals the fake app's client
  # secret under the KEK, so it needs the synthetic ring as web has it. The normal `alembic
  # upgrade head` run does not read it.
  migrate:
    secrets:
      - connection_kek

  # The worker refuses to start without the KEK ring (connection_kek, a synthetic file that
  # scripts/worktree.sh init creates); the base file mounts it for web only.
  worker:
    environment:
      OWNVITALS_PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-8000}
    secrets:
      - connection_kek
    volumes:
      - ./e2e/.certs/cacert.pem:/app/.venv/lib/python3.12/site-packages/certifi/cacert.pem:ro
    depends_on:
      fake-withings:
        condition: service_healthy

  fake-oidc:
    build: ./e2e/fake-oidc
    image: ${COMPOSE_PROJECT_NAME:-ownvitals}-fake-oidc:local
    restart: "no"
    environment:
      OWNVITALS_ENVIRONMENT: test
      FAKE_OIDC_CLIENT_ID: e2e-client.apps.googleusercontent.com
      FAKE_OIDC_REDIRECT_BASE: http://localhost:${WEB_PORT:-8000}
    secrets:
      - oauth_google_client_secret
    volumes:
      - ./e2e/.certs/oidc.key:/certs/oidc.key:ro
      - ./e2e/.certs/oidc.pem:/certs/oidc.pem:ro
    # The container's user is not root and listens on 443.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      default:
        aliases:
          - oauth2.googleapis.com
          - www.googleapis.com
    ports:
      - "127.0.0.1:${FAKE_OIDC_PORT:-9100}:9100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9100/__test/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 20

  fake-withings:
    build: ./e2e/fake-withings
    image: ${COMPOSE_PROJECT_NAME:-ownvitals}-fake-withings:local
    restart: "no"
    environment:
      OWNVITALS_ENVIRONMENT: test
      FAKE_WITHINGS_CLIENT_ID: e2e-withings-client
      # https: the app's callback base must be an https origin (withings-apps create refuses
      # anything else). The stack itself is plain http, so the spec that follows the redirect
      # (answerWithings in e2e/helpers/fake-withings.ts) sends the browser to the same path and
      # query on http://localhost. The code exchange checks this exact URI.
      FAKE_WITHINGS_REDIRECT_URI: https://localhost:${WEB_PORT:-8000}/api/oauth/withings/callback
      # The callback URL a worker subscribes is built from the public base URL, which this
      # container cannot reach: the HEAD check and webhook deliveries go to web instead.
      FAKE_WITHINGS_CALLBACK_BASE: http://web:8000
    volumes:
      - ./backend/tests:/protocol:ro
      - ./e2e/.certs/withings.key:/certs/withings.key:ro
      - ./e2e/.certs/withings.pem:/certs/withings.pem:ro
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      default:
        aliases:
          - wbsapi.withings.net
          - account.withings.com
    # No `ports:` on purpose: nothing of this service is reachable from the host.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/__e2e/ready', timeout=3)"
      interval: 2s
      timeout: 5s
      retries: 20

secrets:
  oauth_google_client_secret:
    file: ./secrets/oauth_google_client_secret
