# Local stack: db, migrate and db-functions (one-shot), web and worker.
# Ports bind 127.0.0.1 only and come from .env (scripts/worktree.sh init writes it).
# Passwords are files under secrets/ mounted as Docker secrets, never environment variables.
# The database roles (ADR 0002 section 5): db creates ownvitals_owner and ownvitals_app on the
# first start of an empty volume (docker/postgres/init); migrate connects as the owner, web and
# the worker as the app role. Only db and db-functions (the job queue's functions, ADR 0005
# section 3) hold the postgres superuser's password.

x-app: &app
  build: .
  image: ${COMPOSE_PROJECT_NAME:-ownvitals}:local
  restart: "no"
  environment: &app-env
    OWNVITALS_ENVIRONMENT: dev
    # Web and the worker connect as the app role; the password comes from the database_password
    # secret file (Settings reads it). Migrations use the owner role (see `migrate`).
    OWNVITALS_DATABASE_URL: postgresql+psycopg://ownvitals_app@db:5432/ownvitals
    # The origin the browser uses; the Origin check compares against it.
    OWNVITALS_PUBLIC_BASE_URL: http://127.0.0.1:${WEB_PORT:-8000}
    # The id of the current key-encryption key, the secret file connection_kek.
    OWNVITALS_CONNECTION_KEK_ID: ${CONNECTION_KEK_ID:-kek-1}

services:
  db:
    # The multi-arch index digest of postgres:17.11 (docs/dev/jobs.md says where it comes from);
    # CI's backend service runs the same one (test_compose_roles.py checks both).
    image: postgres:17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ownvitals
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - database_owner_password
      - database_password
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates ownvitals_owner and ownvitals_app with their passwords from the two secret files
      # on the first start of an empty volume (`docker compose down -v` to get them on an older
      # volume). The one host path holding SQL that a service reads, allowed because it runs on
      # the first start only and creates roles, not the functions a deploy updates
      # (docs/dev/stack.md; test_compose_host_sql.py allows exactly this mount).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ownvitals"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Alembic as the owner role; its password never reaches web.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      OWNVITALS_MIGRATIONS_DATABASE_URL: postgresql+psycopg://ownvitals_owner@db:5432/ownvitals
    secrets:
      - database_owner_password
    depends_on:
      db:
        condition: service_healthy

  # The job queue's role and SECURITY DEFINER functions (ADR 0005 section 3): 20-queue.sql as the
  # superuser after the migrations, in one transaction, run again on every start (it is
  # idempotent and repairs drift). It runs the application image, which carries the SQL and the
  # entrypoint under /app/db-functions: the functions always come from the image (on the server,
  # the deployed release's digest), never from a host path (docs/dev/stack.md). Besides `db`, the
  # only service with the postgres_password secret; the password goes into a PGPASSFILE on a tmpfs
  # built at run time, never into the environment or the command line, so it is not in
  # `docker inspect`. No volumes and no environment of its own.
  db-functions:
    build: .
    image: ${COMPOSE_PROJECT_NAME:-ownvitals}:local
    restart: "no"
    entrypoint: ["sh", "/app/db-functions/db-functions.sh"]
    secrets:
      - postgres_password
    tmpfs:
      - /run/pgpass:mode=0700,uid=10001,gid=10001
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    restart: unless-stopped
    # The account mails (#10) go to mailpit; only web (and the operator CLI) sends mail, never
    # the worker (roadmap Amendment 1). Plain SMTP is allowed for the mailpit host only.
    environment:
      <<: *app-env
      OWNVITALS_SMTP_HOST: mailpit
      OWNVITALS_SMTP_PORT: "1025"
      OWNVITALS_SMTP_TLS: none
    secrets:
      - database_password
      - app_secret_key
      - connection_kek
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db-functions:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20

  # The job worker (ADR 0005 section 5). It refuses to start on a privileged role or a drifted
  # queue (exit code 2). On SIGTERM it waits up to 25 s for runs to reach a checkpoint, then hands
  # their leases back (each under the role's 5 s lock_timeout), within these 30 s.
  worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "ownvitals.worker"]
    stop_grace_period: 30s
    # Only the app role's password: the worker reads no connection secret before #77 adds the KEK
    # ring check (connection_kek) and M1 the Withings kinds.
    secrets:
      - database_password
    depends_on:
      db-functions:
        condition: service_completed_successfully

  # A local mail catcher for the account mails (#10): SMTP on 1025 inside the stack only, its
  # web inbox on 127.0.0.1. Nothing leaves the machine; it keeps the mails in memory.
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_owner_password:
    file: ./secrets/database_owner_password
  database_password:
    file: ./secrets/database_password
  app_secret_key:
    file: ./secrets/app_secret_key
  connection_kek:
    file: ./secrets/connection_kek

volumes:
  db-data:
