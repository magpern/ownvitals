[project]
name = "ownvitals"
version = "0.1.0"
description = "ownvitals backend: web API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi==25.1.0",
    "authlib==1.9.1",
    "certifi>=2026.10.23",  # the TLS trust store of the outbound clients
    "cryptography==50.0.2",
    "fastapi>=0.138",
    "httpx==0.28.1",
    "joserfc==1.7.7",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyotp==2.10.0",
    "scipy>=1.18.1",
    "segno==1.6.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.34",  # no extras: uvloop bypasses the egress hook (ADR 0009); h11 serves HTTP
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pyyaml==6.0.3",  # for #118's compose tests (uvicorn[standard] brought it before ADR 0009)
    "ruff>=0.8",
]
# Only for CI (`uv run --only-group audit`); not installed in the runtime image.
audit = [
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ownvitals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "tests", "migrations"]
venvPath = "."
venv = ".venv"
