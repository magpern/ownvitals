name: CI

# Not on push to main: main only receives squashes of pull requests that passed here with the
# branch up to date (the main ruleset requires it). A pull request runs what its diff needs; the
# weekly run (and a manual one) runs everything, which also picks up new advisories.
on:
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs does this change need? See scripts/ci-changes.sh (tested by scripts/test-ci-gate.sh).
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-changes.sh

  # Everything cheap that must run on every change, as steps of one runner. gitleaks and Trivy are
  # checksum-verified release binaries (scripts/test-ci-downloads.sh tests the checks), bumped by
  # hand: Dependabot does not see them (docs/dev/release.md).
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The specification is frozen at Revision 3 (docs/roadmap.md). Amendments go in the roadmap,
      # never into these files.
      - name: Frozen specification unchanged
        env:
          FROZEN: 635901dd167c0c3fd2dbb6ccdc504386ad7b69f3
        run: |
          set -euo pipefail
          git cat-file -e "${FROZEN}^{commit}"
          git diff --exit-code --stat "$FROZEN" HEAD -- \
            docs/PLAN.md docs/PLAN-operations.md docs/withings-findings.md \
            || { echo "::error::the frozen specification changed; amend it in docs/roadmap.md instead"; exit 1; }

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks

      # A pull request's own commits; the weekly and manual runs scan the whole history.
      - name: Secret scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            # A missing SHA or an empty range would make gitleaks report "no leaks" over 0
            # commits: fail instead. --diff-merges=first-parent makes `git log -p` show the diff
            # of a merge commit, so a secret added only in a hand-resolved merge is scanned.
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            count="$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")"
            [ "$count" -gt 0 ] || { echo "secret scan: no commits in ${BASE_SHA}..${HEAD_SHA}" >&2; exit 1; }
            "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 \
              --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" .
          else
            "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
          fi

      # The repository's shell: scripts/*.sh, the deploy's forced command and the database
      # containers' scripts (docker/postgres/**/*.sh, POSIX sh: the images run them with dash).
      - name: bash -n
        run: |
          set -euo pipefail
          for f in scripts/*.sh deploy/ownvitals-deploy; do bash -n "$f"; done
          mapfile -t postgres_scripts < <(find docker/postgres -type f -name '*.sh' | sort)
          [ "${#postgres_scripts[@]}" -gt 0 ] || { echo "::error::no docker/postgres scripts"; exit 1; }
          for f in "${postgres_scripts[@]}"; do sh -n "$f"; done

      # koalaman/shellcheck v0.11.0, pinned by its index digest. Dependabot does not track an
      # image used in a `run:` step: bump the tag and digest here by hand. Any warning fails.
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t postgres_scripts < <(find docker/postgres -type f -name '*.sh' | sort)
          [ "${#postgres_scripts[@]}" -gt 0 ] || { echo "::error::no docker/postgres scripts"; exit 1; }
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/*.sh deploy/ownvitals-deploy "${postgres_scripts[@]}"

      - name: CI gate and change-filter tests
        run: scripts/test-ci-gate.sh

      # release.yml's guards (the deploy relies on its attestation) and the checksum checks of
      # the gitleaks and Trivy downloads, each run against fakes: no network, no tag, no registry.
      - name: Release workflow tests
        run: scripts/test-release.sh

      - name: Download checksum tests
        run: scripts/test-ci-downloads.sh

      # rhysd/actionlint v1.7.12 (includes shellcheck), pinned by its index digest. Dependabot
      # does not track an image used in a `run:` step: bump the tag and digest here by hand.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # Every setup-uv step's version, and the uv commands in docs/dev/backend.md, equal the
      # Dockerfile's uv tag (scripts/ci-uv-version.sh; yq v4 is on the runner image).
      - name: uv version matches the Dockerfile
        run: scripts/ci-uv-version.sh

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Must equal the ghcr.io/astral-sh/uv tag in the Dockerfile (checked above).
          version: 0.13.6

      # pip-audit itself comes from the hash-locked `audit` group of backend/uv.lock. It audits
      # exactly what uv.lock pins: production dependencies, then every group (dev and audit) too.
      # A missing backend/ fails the step. A new advisory: upgrade first (AGENTS.md, "CI").
      - name: pip-audit
        working-directory: backend
        run: |
          set -euo pipefail
          uv sync --frozen --only-group audit
          uv export -q --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements-prod.txt"
          uv export -q --frozen --no-emit-project --all-groups -o "$RUNNER_TEMP/requirements-all.txt"
          for f in requirements-prod requirements-all; do
            uv run --frozen --only-group audit pip-audit \
              --require-hashes --disable-pip --strict \
              -r "$RUNNER_TEMP/$f.txt"
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # High and critical advisories fail; the moderate, dev-only ones of the ESLint chain
      # (minimatch, PR #34) do not. frontend/ is required; e2e/ is audited once it exists (its
      # harness issue makes it required too).
      - name: npm audit
        run: |
          set -euo pipefail
          (cd frontend && npm audit --audit-level=high)
          if [ -d e2e ]; then
            (cd e2e && npm audit --audit-level=high)
          else
            echo "::notice::no e2e/ yet; nothing to audit there"
          fi

      # Trivy fails on HIGH and CRITICAL findings that have a fix available (--ignore-unfixed):
      # unfixed ones are an accepted risk (AGENTS.md, "CI"). Exceptions go in .trivyignore with a
      # reason and an exp:YYYY-MM-DD expiry. Development dependencies are not scanned (Trivy's
      # default); pip-audit and npm audit cover them.
      - name: Install Trivy
        env:
          VERSION: 0.76.1
          SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tgz" | sha256sum --check
          tar -xzf trivy.tgz trivy

      - name: Trivy repository scan
        run: |
          "$RUNNER_TEMP/trivy" fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs node_modules --skip-dirs .venv \
            .

  # The database roles and the queue functions run here too. No step is skipped: a missing
  # backend/, pyproject.toml or uv.lock fails the job at `uv sync --locked`.
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # compose.yaml's db image, the same index digest (test_compose_roles.py checks it).
        image: postgres:17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          # Throwaway database of this job only; not a secret.
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OWNVITALS_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/ownvitals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script the compose db container runs (docker/postgres/init, ADR 0002 section 5),
      # against the service container, twice: the second run proves it is idempotent. The test
      # fixtures replace the role passwords with random ones of their own.
      - name: Create the application database and its roles
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE ownvitals'
          secrets="$RUNNER_TEMP/secrets"
          mkdir -p "$secrets"
          openssl rand -hex 16 > "$secrets/database_owner_password"
          openssl rand -hex 16 > "$secrets/database_password"
          export DATABASE_OWNER_PASSWORD_FILE="$secrets/database_owner_password"
          export DATABASE_PASSWORD_FILE="$secrets/database_password"
          psql -v ON_ERROR_STOP=1 -d ownvitals -f docker/postgres/init/10-roles.sql
          psql -v ON_ERROR_STOP=1 -d ownvitals -f docker/postgres/init/10-roles.sql

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6

      - name: Install dependencies
        run: uv sync --locked

      # The job queue's script (docker/postgres/queue/20-queue.sql, ADR 0005 section 3) as the
      # compose db-functions service runs it: after the migrations, as the superuser, through its
      # runner (python -m ownvitals.db.install_functions, the password in a PGPASSFILE only), in
      # one transaction, twice (the second run proves it is idempotent). The digests the worker
      # checks must then match what this Postgres image renders (a stale queue_digests.py fails
      # here). Afterwards the queue is uninstalled and the schema migrated back: guard 2 (role_guard.py)
      # does not know the queue role yet (#77 item 2), and the test fixtures install the queue
      # themselves and remove it again.
      - name: Install the job queue twice and check its digests
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test
          OWNVITALS_MIGRATIONS_DATABASE_URL: postgresql+psycopg://ownvitals_owner@127.0.0.1:5432/ownvitals
        run: |
          set -euo pipefail
          export OWNVITALS_SECRETS_DIR="$RUNNER_TEMP/secrets"
          uv run alembic upgrade head
          pgpass="$RUNNER_TEMP/pgpass"
          (umask 077 && printf '127.0.0.1:5432:ownvitals:postgres:%s\n' "$PGPASSWORD" > "$pgpass")
          # The runner refuses every PG* variable but PGPASSFILE: the step's (and the runner
          # image's, if any) are dropped for it.
          mapfile -t no_pg < <(compgen -e | grep '^PG' | sed 's/^/-u/')
          for _ in 1 2; do
            env "${no_pg[@]}" PGPASSFILE="$pgpass" \
              uv run python -m ownvitals.db.install_functions \
              "host=127.0.0.1 port=5432 dbname=ownvitals user=postgres" \
              ../docker/postgres/queue/20-queue.sql
          done
          uv run python tests/queue_digests.py --check
          psql -v ON_ERROR_STOP=1 -X -q -d ownvitals \
            -c 'DROP OWNED BY ownvitals_queue CASCADE' -c 'DROP ROLE ownvitals_queue'
          uv run alembic downgrade base

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q

  # No step is skipped: a missing frontend/ or package-lock.json fails the job.
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The one required check besides `pr-title`. `changes` and `checks` must succeed. Every other job
  # must succeed, or be skipped while its filter output is false (scripts/ci-gate.sh, tested in
  # `checks`). A job that is needed but skipped, cancelled or failed fails the gate.
  ci:
    name: ci
    if: always()
    needs: [changes, checks, backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: All needed jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh
