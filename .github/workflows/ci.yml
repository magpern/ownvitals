name: CI

# A pull request runs what its diff needs. Every push to main runs everything: the branch of a
# pull request need not be up to date when it merges (roadmap Amendment 8), so this run is the
# safety net for two PRs that were green alone but break together. A red main is fixed forward
# first. The weekly run (and a manual one) also runs everything and picks up new advisories.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's older run. A run on main is never cancelled: its group
# is per commit.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs does this change need? See scripts/ci-changes.sh (tested by scripts/test-ci-gate.sh).
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
      playwright: ${{ steps.filter.outputs.playwright }}
      all: ${{ steps.filter.outputs.all }}
      # The backend test shard count, from the backend-tests matrix's shard list (the one source).
      shards: ${{ steps.shards.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-changes.sh

      # Fails the run when the matrix is not exactly `shard: [1..N]` (scripts/ci-shards.sh).
      - id: shards
        run: |
          set -euo pipefail
          total="$(scripts/ci-shards.sh)"
          echo "total=$total" >> "$GITHUB_OUTPUT"

  # Everything cheap that must run on every change, as steps of one runner. gitleaks and Trivy are
  # checksum-verified release binaries (scripts/ci-install-release.sh: retried, cached, re-verified after a cache restore; scripts/test-ci-install-release.sh tests it), bumped by
  # hand: Dependabot does not see them (docs/dev/release.md).
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The specification is frozen at Revision 3 (docs/roadmap.md). Amendments go in the roadmap,
      # never into these files.
      - name: Frozen specification unchanged
        env:
          FROZEN: 635901dd167c0c3fd2dbb6ccdc504386ad7b69f3
        run: |
          set -euo pipefail
          git cat-file -e "${FROZEN}^{commit}"
          git diff --exit-code --stat "$FROZEN" HEAD -- \
            docs/PLAN.md docs/PLAN-operations.md docs/withings-findings.md \
            || { echo "::error::the frozen specification changed; amend it in docs/roadmap.md instead"; exit 1; }

      # The owner's local real-account work (docs/dev/local-real-account.md) stays on that machine:
      # no .env, secrets/, local-real/, probe output or database dump is ever tracked (#450).
      - name: No local real-account files tracked
        run: scripts/local-real-guard.sh tracked

      # The cache holds the tarball; ci-install-release.sh checks its SHA-256 again after a restore
      # and fails the job on a mismatch. Bump the `v1` in the key to evict a bad entry.
      - name: Cache gitleaks download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-cache/gitleaks
          key: v1-gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}

      - name: Install gitleaks
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-install-release.sh" gitleaks "$GITLEAKS_SHA256" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$RUNNER_TEMP/release-cache/gitleaks" "$RUNNER_TEMP"

      # A pull request's own commits; the weekly and manual runs scan the whole history.
      - name: Secret scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            # A missing SHA or an empty range would make gitleaks report "no leaks" over 0
            # commits: fail instead. --diff-merges=first-parent makes `git log -p` show the diff
            # of a merge commit, so a secret added only in a hand-resolved merge is scanned.
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            count="$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")"
            [ "$count" -gt 0 ] || { echo "secret scan: no commits in ${BASE_SHA}..${HEAD_SHA}" >&2; exit 1; }
            "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 \
              --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" .
          else
            "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
          fi

      # The repository's shell: scripts/*.sh, the deploy's forced command, the backup and
      # restore-drill scripts (deploy/backup/*) and the database containers' scripts
      # (docker/postgres/**/*.sh, POSIX sh: the images run them with dash).
      - name: bash -n
        run: |
          set -euo pipefail
          for f in scripts/*.sh deploy/ownvitals-deploy deploy/backup/*; do bash -n "$f"; done
          mapfile -t postgres_scripts < <(find docker/postgres -type f -name '*.sh' | sort)
          [ "${#postgres_scripts[@]}" -gt 0 ] || { echo "::error::no docker/postgres scripts"; exit 1; }
          for f in "${postgres_scripts[@]}"; do sh -n "$f"; done

      # koalaman/shellcheck v0.11.0, pinned by its index digest. Dependabot does not track an
      # image used in a `run:` step: bump the tag and digest here by hand. Any warning fails.
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t postgres_scripts < <(find docker/postgres -type f -name '*.sh' | sort)
          [ "${#postgres_scripts[@]}" -gt 0 ] || { echo "::error::no docker/postgres scripts"; exit 1; }
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/*.sh deploy/ownvitals-deploy deploy/backup/* "${postgres_scripts[@]}"

      - name: CI gate and change-filter tests
        run: scripts/test-ci-gate.sh

      # release.yml's guards (the deploy relies on its attestation) and the checksum checks of
      # the gitleaks and Trivy downloads, each run against fakes: no network, no tag, no registry.
      - name: Release workflow tests
        run: scripts/test-release.sh

      - name: Release download tests
        run: scripts/test-ci-install-release.sh

      # rhysd/actionlint v1.7.12 (includes shellcheck), pinned by its index digest. Dependabot
      # does not track an image used in a `run:` step: bump the tag and digest here by hand.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # Every setup-uv step's version, and the uv commands in docs/dev/backend.md, equal the
      # Dockerfile's uv tag (scripts/ci-uv-version.sh; yq v4 is on the runner image).
      - name: uv version matches the Dockerfile
        run: scripts/ci-uv-version.sh

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Must equal the ghcr.io/astral-sh/uv tag in the Dockerfile (checked above).
          version: 0.13.6

      # pip-audit itself comes from the hash-locked `audit` group of backend/uv.lock. It audits
      # exactly what uv.lock pins: production dependencies, then every group (dev and audit) too.
      # A missing backend/ fails the step. A new advisory: upgrade first (AGENTS.md, "CI").
      - name: pip-audit
        working-directory: backend
        run: |
          set -euo pipefail
          uv sync --frozen --only-group audit
          uv export -q --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements-prod.txt"
          uv export -q --frozen --no-emit-project --all-groups -o "$RUNNER_TEMP/requirements-all.txt"
          for f in requirements-prod requirements-all; do
            uv run --frozen --only-group audit pip-audit \
              --require-hashes --disable-pip --strict \
              -r "$RUNNER_TEMP/$f.txt"
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # High and critical advisories fail; the moderate, dev-only ones of the ESLint chain
      # (minimatch, PR #34) do not. frontend/ and e2e/ are both required: removing either fails
      # this step (cd fails) instead of silently skipping its audit.
      - name: npm audit
        run: |
          set -euo pipefail
          (cd frontend && npm audit --audit-level=high)
          (cd e2e && npm audit --audit-level=high)

      # Trivy fails on HIGH and CRITICAL findings that have a fix available (--ignore-unfixed):
      # unfixed ones are an accepted risk (AGENTS.md, "CI"). Exceptions go in .trivyignore with a
      # reason and an exp:YYYY-MM-DD expiry. Development dependencies are not scanned (Trivy's
      # default); pip-audit and npm audit cover them.
      # The cache holds the tarball; ci-install-release.sh checks its SHA-256 again after a restore
      # and fails the job on a mismatch. Bump the `v1` in the key to evict a bad entry.
      - name: Cache Trivy download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-cache/trivy
          key: v1-trivy-${{ runner.os }}-${{ runner.arch }}-${{ env.TRIVY_VERSION }}

      - name: Install Trivy
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-install-release.sh" trivy "$TRIVY_SHA256" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            "$RUNNER_TEMP/release-cache/trivy" "$RUNNER_TEMP"

      - name: Trivy repository scan
        run: |
          "$RUNNER_TEMP/trivy" fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs node_modules --skip-dirs .venv \
            .

  # Once per run, without a database: lint, format, types and the shard check. The database
  # setup, the queue functions and the tests run in every `backend-tests` shard. No step is
  # skipped: a missing backend/, pyproject.toml or uv.lock fails the job at `uv sync --locked`.
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      # The backend-tests matrix runs each test file in exactly one shard (tests/shards.py
      # compares pytest's own collection with the split). The shard count comes from one place,
      # the matrix's `shard` list (scripts/ci-shards.sh in `changes`), here and in every shard.
      - name: Every test file is in exactly one shard
        env:
          TOTAL: ${{ needs.changes.outputs.shards }}
        run: |
          set -euo pipefail
          [[ $TOTAL =~ ^[1-9][0-9]*$ ]] || { echo "::error::no shard count from changes"; exit 1; }
          uv run python tests/shards.py check "$TOTAL"

  # pytest in parallel shards, each with its own Postgres (tests/shards.py: a stable hash of the
  # file path). Every shard sets up the roles and installs the queue functions, which the tests
  # need. The `ci` gate sees one result for the matrix: failure or cancelled if any shard is.
  backend-tests:
    name: Backend tests (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # The only place the shard count is set: scripts/ci-shards.sh reads it from this list and
      # refuses another axis, include or exclude.
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # compose.yaml's db image, the same index digest (test_compose_roles.py checks it).
        image: postgres:17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          # Throwaway database of this job only; not a secret.
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OWNVITALS_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/ownvitals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script the compose db container runs (docker/postgres/init, ADR 0002 section 5),
      # against the service container, twice: the second run proves it is idempotent. It also
      # creates ownvitals_maint LOGIN from database_maint_password (#126). The test fixtures
      # replace the owner and app passwords with random ones of their own.
      - name: Create the application database and its roles
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE ownvitals'
          secrets="$RUNNER_TEMP/secrets"
          mkdir -p "$secrets"
          openssl rand -hex 16 > "$secrets/database_owner_password"
          openssl rand -hex 16 > "$secrets/database_password"
          openssl rand -hex 16 > "$secrets/database_maint_password"
          export DATABASE_OWNER_PASSWORD_FILE="$secrets/database_owner_password"
          export DATABASE_PASSWORD_FILE="$secrets/database_password"
          export DATABASE_MAINT_PASSWORD_FILE="$secrets/database_maint_password"
          psql -v ON_ERROR_STOP=1 -d ownvitals -f docker/postgres/init/10-roles.sql
          psql -v ON_ERROR_STOP=1 -d ownvitals -f docker/postgres/init/10-roles.sql
          login=$(psql -v ON_ERROR_STOP=1 -d ownvitals -tAc "SELECT rolcanlogin FROM pg_roles WHERE rolname = 'ownvitals_maint'")
          test "$login" = t

      # age for the backup tests (test_backup_*.py, docs/dev/backup.md): Ubuntu's signed
      # package, the one the owner installs on the server. The tests fail in CI without it.
      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age
          age --version

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6

      - name: Install dependencies
        run: uv sync --locked

      # The job queue's script (docker/postgres/queue/20-queue.sql, ADR 0005 section 3) as the
      # compose db-functions service runs it: after the migrations, as the superuser, through its
      # runner (python -m ownvitals.db.install_functions, the password in a PGPASSFILE only), in
      # one transaction, twice (the second run proves it is idempotent). 40-withings.sql is in
      # that same invocation, after 20-queue.sql, so the second run sees its three functions, and
      # so are the AI cost cap's 50-ai.sql (ADR 0014 section 7) and the export purge's
      # 60-exports.sql (ADR 0013 section 4) and the admin account family's 70-admin-accounts.sql
      # (ADR 0002 section 3, #314), whose functions are pinned in the same file. The
      # list and its order are those of docker/postgres/queue/db-functions.sh (rate.sql,
      # 30-maint.sql and 50-outbox.sql included); test_db_functions_script.py fails if they differ.
      # The digests the worker checks must then match what this Postgres image renders (a stale
      # queue_digests.py fails here). The queue and those functions stay installed: guard 2 and
      # web startup see them through the migrated harness, which drops them only so a downgrade
      # can remove the tables.
      - name: Install the job queue twice and check its digests
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test
          OWNVITALS_MIGRATIONS_DATABASE_URL: postgresql+psycopg://ownvitals_owner@127.0.0.1:5432/ownvitals
        run: |
          set -euo pipefail
          export OWNVITALS_SECRETS_DIR="$RUNNER_TEMP/secrets"
          uv run alembic upgrade head
          pgpass="$RUNNER_TEMP/pgpass"
          (umask 077 && printf '127.0.0.1:5432:ownvitals:postgres:%s\n' "$PGPASSWORD" > "$pgpass")
          # The runner refuses every PG* variable but PGPASSFILE: the step's (and the runner
          # image's, if any) are dropped for it.
          mapfile -t no_pg < <(compgen -e | grep '^PG' | sed 's/^/-u/')
          for _ in 1 2; do
            env "${no_pg[@]}" PGPASSFILE="$pgpass" \
              uv run python -m ownvitals.db.install_functions \
              "host=127.0.0.1 port=5432 dbname=ownvitals user=postgres" \
              ../docker/postgres/queue/20-queue.sql \
              ../docker/postgres/maint/30-maint.sql \
              ../docker/postgres/withings/40-withings.sql \
              ../docker/postgres/withings/rate.sql \
              ../docker/postgres/notify/50-outbox.sql \
              ../docker/postgres/ai/50-ai.sql \
              ../docker/postgres/exports/60-exports.sql \
              ../docker/postgres/maint/70-admin-accounts.sql
          done
          uv run python tests/queue_digests.py --check

      - name: Tests
        env:
          SHARD: ${{ matrix.shard }}
          # The count from the matrix's shard list, computed once in `changes` and passed to the
          # shard check and every shard alike; never strategy.job-total.
          TOTAL: ${{ needs.changes.outputs.shards }}
        run: |
          set -euo pipefail
          [[ $TOTAL =~ ^[1-9][0-9]*$ ]] || { echo "::error::no shard count from changes"; exit 1; }
          mapfile -t files < <(uv run python tests/shards.py list "$SHARD" "$TOTAL")
          [ "${#files[@]}" -gt 0 ] || { echo "::error::shard $SHARD of $TOTAL is empty"; exit 1; }
          echo "shard $SHARD of $TOTAL: ${#files[@]} test files"
          uv run pytest -q "${files[@]}"

  # No step is skipped: a missing frontend/ or package-lock.json fails the job.
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Gzip budget for the built JS and CSS (scripts/bundle-budget.mjs).
      - run: npm run check:bundle

  # The compose stack with fakes only (Google's back channel, mail), the image scan, then the
  # Playwright specs against it (docs/dev/e2e.md). Runs when the stack changed (filter `stack`);
  # the e2e dependencies, Chromium, the type check and the specs run only when the `playwright`
  # filter is true (UI, e2e, compose or Docker files; always on `main`, weekly and manual runs).
  # The Trivy release is the same one, with the
  # same checksum, as the `checks` job's (bump both together).
  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The cache holds the tarball; ci-install-release.sh checks its SHA-256 again after a restore
      # and fails the job on a mismatch. Bump the `v1` in the key to evict a bad entry.
      - name: Cache Trivy download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-cache/trivy
          key: v1-trivy-${{ runner.os }}-${{ runner.arch }}-${{ env.TRIVY_VERSION }}

      - name: Install Trivy
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-install-release.sh" trivy "$TRIVY_SHA256" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            "$RUNNER_TEMP/release-cache/trivy" "$RUNNER_TEMP"

      # Builds web and fake-oidc, generates the throwaway CA and the OAuth secret, starts the
      # stack and waits for /api/ready.
      - name: Build and start the stack
        run: e2e/scripts/stack-up.sh

      - name: Stack checks
        run: e2e/scripts/stack-checks.sh

      # The image web and the worker run, as built above. Fails on HIGH and CRITICAL findings
      # that have a fix (--ignore-unfixed); .trivyignore applies (AGENTS.md, "CI").
      - name: Trivy image scan
        run: |
          set -euo pipefail
          image="$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' .env):local"
          "$RUNNER_TEMP/trivy" image \
            --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$image"

      - name: Install the e2e dependencies and Chromium
        if: needs.changes.outputs.playwright == 'true'
        working-directory: e2e
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Type check
        if: needs.changes.outputs.playwright == 'true'
        working-directory: e2e
        run: npm run typecheck

      - name: Playwright specs
        if: needs.changes.outputs.playwright == 'true'
        working-directory: e2e
        env:
          CI: "true"
        run: npm test

      # What a failed run needs to be read: the last log lines of each service. Compose prints no
      # secret (they are files); the filter is a second guard.
      - name: Stack logs
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.e2e.yaml ps -a || true
          docker compose -f compose.yaml -f compose.e2e.yaml logs --tail 25 --no-color 2>&1 \
            | sed -E 's/(token|secret|password)=[^ ]*/\1=<redacted>/Ig' || true

      - name: Stop the stack
        if: always()
        run: e2e/scripts/stack-down.sh

  # The one required check besides `pr-title`. `changes` and `checks` must succeed. Every other job
  # must succeed, or be skipped while its filter output is false (scripts/ci-gate.sh, tested in
  # `checks`). A job that is needed but skipped, cancelled or failed fails the gate.
  ci:
    name: ci
    if: always()
    needs: [changes, checks, backend, backend-tests, frontend, e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: All needed jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh
